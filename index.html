<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti ❤</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap">
<style>
/* Paleta Cinnamoroll */
:root{--cielo:#dff2fc;--azul:#8ccbee;--azul-osc:#4a8fc4;--rosado:#f7a8c4;--rosa-letra:#f48fb8;--fondo:#eef8fe;--texto:#3b5f80}
*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka',system-ui,sans-serif;background:var(--fondo) repeating-conic-gradient(#e6f4fd 0 25%,transparent 0 50%) 0 0/28px 28px;color:var(--texto)}
/* letra tipo logo de Cinnamoroll: rosada con borde blanco y sombra celeste */
h1,.titulo,#citas summary span,.carta strong,#carta h2,#pregunta,.grande{font-family:'Pacifico',cursive;font-weight:400;color:var(--rosa-letra);
  text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff,3px 4px 0 var(--azul)}
main section:not([hidden]){animation:entrar .4s ease-out}
@keyframes entrar{from{opacity:0;translate:0 14px}}

/* Encabezado: cielo con nubes que pasan y Cinnamoroll flotando */
.cielo{position:relative;overflow:hidden;padding:22px 16px 26px;text-align:center;border-radius:0 0 32px 32px;
  background:linear-gradient(170deg,#7cc0ea,#b6e2f8 60%,#d7effb);box-shadow:0 4px 0 var(--azul)}
.cielo .logo{position:relative;z-index:1;margin:0;font-size:2.4rem;line-height:1.3}
.cielo .sub{position:relative;z-index:1;margin:2px 0 0;color:#fff;font-weight:600;text-shadow:0 1px 2px #4a8fc488}
.nube{position:absolute;color:#fff;opacity:.85;animation:pasar linear infinite;pointer-events:none}
@keyframes pasar{from{translate:-30vw 0}to{translate:130vw 0}}
.brillo{position:absolute;color:#fff;animation:titilar 2s ease-in-out infinite;pointer-events:none}
@keyframes titilar{50%{opacity:.2;scale:.6}}
#cabeza-cinna{position:absolute;z-index:1;right:10px;bottom:6px;width:74px;animation:flotar 2.4s ease-in-out infinite}
#cabeza-cinna>*{width:100%;height:auto;display:block}
nav{position:sticky;top:0;z-index:1;display:flex;justify-content:center;gap:8px;padding:12px 8px;background:#eef8fed9;backdrop-filter:blur(6px)}
nav button{padding:8px 16px;border:2px solid var(--azul);border-radius:999px;background:#fff;font:inherit;font-weight:600;font-size:1rem;color:var(--azul-osc);cursor:pointer;transition:background .2s,color .2s,scale .2s}
nav button[aria-selected=true]{background:var(--rosado);border-color:var(--rosa-letra);color:#fff;scale:1.06;animation:rebote .4s}
@keyframes rebote{40%{scale:1.15}}
main{max-width:720px;margin:auto;padding:8px 16px 24px}
h1{text-align:center;font-size:2rem}
.cartas{display:grid;gap:12px}
.carta{display:flex;gap:14px;align-items:center;padding:12px;border:3px solid var(--azul);border-radius:6px;background:#fff;box-shadow:4px 4px 0 var(--azul);text-align:left;font:inherit;color:inherit;cursor:pointer}
.carta strong{color:var(--azul-osc);font-weight:500;font-size:1.1rem}
.carta small{display:block;opacity:.7;margin-top:4px}
.mini{width:64px;height:64px;flex:none;border-radius:4px;overflow:hidden;background:var(--cielo)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.grande{font-size:4.5rem;text-align:center;color:var(--azul-osc);margin:24px 0 0}
.centro{text-align:center}
#contador .centro{font-size:1.1rem}
#citas details{margin-bottom:14px;padding:4px 14px;border:3px solid var(--azul);border-radius:6px;background:#fff;box-shadow:4px 4px 0 var(--azul)}
#citas summary{display:flex;align-items:center;gap:8px;padding:10px 0;list-style:none;cursor:pointer;font-size:1.3rem;color:var(--azul-osc)}
#citas summary::-webkit-details-marker{display:none}
#citas summary::before{content:'♡';color:var(--rosado)}
#citas summary small{margin-left:auto;font-size:.9rem;opacity:.7}
#citas summary::after{content:'▸';transition:rotate .2s}
#citas details[open] summary::after{rotate:90deg}
#citas details .album{margin-bottom:14px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.album button{position:relative;padding:0;border:3px solid #fff;border-radius:6px;overflow:hidden;background:var(--cielo);box-shadow:0 0 0 2px var(--azul);cursor:pointer}
.album img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.album .video::after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem;color:#fff;text-shadow:0 0 10px #000a}
dialog{border:3px solid var(--azul);border-radius:6px;max-width:min(600px,92vw);padding:24px;color:inherit}
dialog::backdrop{background:#2a4a6688}
#carta{max-width:min(800px,92vw);box-shadow:6px 6px 0 var(--azul)}
#carta .marco{margin-bottom:12px;border-radius:4px;box-shadow:0 2px 8px #0002}
#carta button{background:var(--rosado);color:#fff;border:3px solid var(--azul-osc);border-radius:999px;padding:8px 22px;font:inherit;font-weight:600;box-shadow:3px 3px 0 var(--azul-osc);cursor:pointer}
/* Inicio */
#inicio{position:fixed;inset:0;z-index:2;display:grid;place-items:center;overflow:hidden;padding:16px;text-align:center;
  background:linear-gradient(#e9f7ff,#fdf0f6);color:var(--azul-osc);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:opacity .6s}
#inicio.saliendo{opacity:0}
.flota{position:absolute;bottom:-40px;font-size:22px;opacity:.7;animation:subir linear infinite;pointer-events:none}
@keyframes subir{to{transform:translateY(-115vh) rotate(25deg)}}
#paso1{display:grid;justify-items:center;gap:10px;position:relative}
.sobre{position:relative;width:170px;height:110px;margin-bottom:8px;background:#fff;border:3px solid var(--azul);border-radius:10px;perspective:400px}
.sobre::after{content:'';position:absolute;inset:0;border-radius:7px;background:linear-gradient(to top right,transparent 49%,var(--cielo) 50%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49%,var(--cielo) 50%) right/50% 100% no-repeat}
.solapa{position:absolute;left:-3px;right:-3px;top:-3px;height:62px;z-index:1;background:var(--azul);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s}
.abierto .solapa{transform:rotateX(180deg)}
.sello{position:absolute;left:50%;top:44px;z-index:2;translate:-50% 0;color:#ff7aa8;font-size:26px;transition:opacity .3s}
.abierto .sello{opacity:0}
/* arco dibujado: la cuerda y la flecha se mueven según la carga (1 unidad del SVG = 1 px) */
#arco{width:140px;height:160px;margin-top:20px;overflow:visible;cursor:grab;touch-action:none}
#arco:active{cursor:grabbing}
#arco .limbo{fill:none;stroke:var(--azul);stroke-width:8;stroke-linecap:round;transition:stroke .2s}
#arco .cuerda{fill:none;stroke:var(--azul-osc);stroke-width:2.5;stroke-linejoin:round}
#arco .puntas{fill:var(--rosado)}
#arco.lista .limbo{stroke:var(--rosa-letra);filter:drop-shadow(0 0 6px var(--rosa-letra))}
#arco.lista{animation:vibrar .12s linear infinite}
@keyframes vibrar{50%{translate:1px 0}}
.carga{width:140px;height:10px;border:2px solid var(--azul);border-radius:6px;background:#fff;overflow:hidden}
.carga i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--rosado) 0 6px,#ff8fb5 6px 12px)}
.pista{font-size:13px;opacity:.8;max-width:320px}
.tiembla{animation:temblar .3s}
@keyframes temblar{25%{translate:-6px}75%{translate:6px}}
#ventana{position:relative;z-index:1;width:min(340px,92vw);background:#fff;border:3px solid var(--azul);border-radius:6px;box-shadow:6px 6px 0 var(--azul);animation:aparecer .45s cubic-bezier(.3,1.6,.6,1)}
@keyframes aparecer{from{transform:scale(.3);opacity:0}}
.barra{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--azul);color:#fff;font-size:15px}
.barra i{display:inline-block;width:12px;height:12px;margin-left:4px;background:#fff;border-radius:2px}
.cuerpo{padding:18px 14px 20px;background:repeating-conic-gradient(#eef8fe 0 25%,#fff 0 50%) 0 0/18px 18px}
#pregunta{font-size:26px;margin:0 0 6px;min-height:2.4em;display:grid;place-items:center}
#paso1 .titulo{font-size:1.6rem;margin:0}
.cinna{width:170px;display:block;margin:0 auto 10px;animation:flotar 2.4s ease-in-out infinite}
@keyframes flotar{50%{translate:0 -6px}}
#inicio .opciones button{font:inherit;font-weight:600;font-size:18px;padding:8px 26px;margin:0 8px;border:3px solid var(--azul-osc);border-radius:999px;cursor:pointer;box-shadow:3px 3px 0 var(--azul-osc)}
#si{background:var(--rosado);color:#fff}
#no{background:#fff;color:var(--azul-osc);transition:left .2s,top .2s}
.corazon{position:fixed;font-size:22px;pointer-events:none;animation:estallar 1.6s ease-out forwards}
@keyframes estallar{from{transform:translate(-50%,-50%) scale(.4)}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.3);opacity:0}}
.marco{position:relative;border-radius:12px;overflow:hidden}
.marco img{position:absolute;left:50%;top:50%}
.marco iframe{display:block;width:100%;height:100%;border:0}
/* Galería a pantalla completa: se desliza con el dedo (scroll-snap) */
#foto{width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:none;overflow:hidden}
#foto::backdrop{background:#16304af2}
.tira{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-content:center;justify-items:center;gap:10px}
.slide p{margin:0;max-width:90vw;color:#fff;text-align:center}
.marco img.portada{left:0;top:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;inset:0;border:0;background:none;color:#fff;font-size:3.5rem;text-shadow:0 0 12px #000a;cursor:pointer}
.gal{position:fixed;z-index:1;border:0;border-radius:999px;background:#ffffffd9;color:var(--azul-osc);font:inherit;font-weight:600;cursor:pointer}
.gal.cerrar{top:12px;right:12px;width:40px;height:40px;font-size:1.2rem}
.gal.ant,.gal.sig{top:50%;translate:0 -50%;width:44px;height:44px;font-size:1.6rem}
.gal.ant{left:10px}.gal.sig{right:10px}
.gal.cuenta{top:16px;left:50%;translate:-50% 0;padding:4px 12px;font-size:.9rem;cursor:default}
@media (pointer:coarse){.gal.ant,.gal.sig{display:none}} /* en el celular se desliza con el dedo */
</style>
</head>
<body>
<div id="inicio">
  <div id="paso1">
    <div class="sobre"><div class="solapa"></div><span class="sello">♥</span></div>
    <p class="titulo">A Little Surprise</p>
    <svg id="arco" viewBox="0 0 140 160" role="button" aria-label="Bow">
      <path class="limbo" d="M15 80Q70-15 125 80"/>
      <circle class="puntas" cx="15" cy="80" r="6"/><circle class="puntas" cx="125" cy="80" r="6"/>
      <polyline class="cuerda" points="15,80 70,80 125,80"/>
      <g class="flechita">
        <line x1="70" y1="24" x2="70" y2="82" stroke="#c98a5a" stroke-width="3" stroke-linecap="round"/>
        <path d="M70 14C64 6 54 12 58 20L70 32L82 20C86 12 76 6 70 14Z" fill="#ff7aa8"/>
        <path d="M70 70l-8 12M70 70l8 12M70 76l-8 12M70 76l8 12" stroke="#f7a8c4" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>
    <div class="carga"><i></i></div>
    <p class="pista">Hold to draw the bow – release when it's full ♡</p>
  </div>
  <div id="ventana" hidden>
    <div class="barra"><span>LOVE ☁</span><span><i></i><i></i><i></i></span></div>
    <div class="cuerpo">
      <p id="pregunta">Do you still love me?</p>
      <!-- Cinnamoroll (fan art) abrazando un corazón -->
      <svg class="cinna" viewBox="0 0 200 175" aria-hidden="true">
        <g stroke="#9cc6e4" stroke-width="3" fill="#fff">
          <ellipse cx="100" cy="138" rx="36" ry="30"/>
          <ellipse cx="42" cy="66" rx="40" ry="16" transform="rotate(-18 42 66)"/>
          <ellipse cx="158" cy="66" rx="40" ry="16" transform="rotate(18 158 66)"/>
          <ellipse cx="100" cy="72" rx="58" ry="48"/>
        </g>
        <ellipse cx="80" cy="76" rx="6" ry="8" fill="#3d6fb6"/>
        <ellipse cx="120" cy="76" rx="6" ry="8" fill="#3d6fb6"/>
        <circle cx="82" cy="73" r="2.2" fill="#fff"/>
        <circle cx="122" cy="73" r="2.2" fill="#fff"/>
        <ellipse cx="66" cy="90" rx="9" ry="5" fill="#f9b6cc"/>
        <ellipse cx="134" cy="90" rx="9" ry="5" fill="#f9b6cc"/>
        <path d="M94 90q3 4 6 0q3 4 6 0" stroke="#6b93b8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M100 162C80 148 76 130 89 127C95 126 100 131 100 134C100 131 105 126 111 127C124 130 120 148 100 162Z" fill="#ff7aa8" stroke="#e0557f" stroke-width="2.5"/>
        <g stroke="#9cc6e4" stroke-width="2.5" fill="#fff">
          <ellipse cx="82" cy="134" rx="9" ry="7"/>
          <ellipse cx="118" cy="134" rx="9" ry="7"/>
        </g>
      </svg>
      <div class="opciones"><button id="si">YES</button><button id="no">NO</button></div>
    </div>
  </div>
</div>
<header class="cielo">
  <p class="logo titulo">Para Nita</p>
  <p class="sub" id="sub"></p>
  <div id="cabeza-cinna" aria-hidden="true"></div>
</header>
<nav>
  <button data-panel="cartas" aria-selected="true">💌 Cartas</button>
  <button data-panel="contador" aria-selected="false">⏳ Contador</button>
  <button data-panel="album" aria-selected="false">📷 Álbum</button>
</nav>
<main>
  <section id="cartas"><h1>Cartas para ti</h1><div class="cartas"></div></section>
  <section id="contador" hidden>
    <h1>Llevamos juntos</h1>
    <p class="grande" id="dias"></p>
    <p class="centro" id="detalle"></p>
    <p class="centro" id="segundos"></p>
  </section>
  <section id="album" hidden><h1>Nuestro álbum</h1><div id="citas"></div></section>
</main>

<dialog id="carta"><h2></h2><div class="paginas"></div><form method="dialog"><button>Cerrar</button></form></dialog>
<dialog id="foto">
  <div class="tira"></div>
  <span class="gal cuenta"></span>
  <button class="gal cerrar" aria-label="Cerrar">✕</button>
  <button class="gal ant" aria-label="Anterior">‹</button>
  <button class="gal sig" aria-label="Siguiente">›</button>
</dialog>

<script>
// ✏️ ===== EDITA AQUÍ ===== ✏️
const INICIO = '2026-09-04T00:00-05:00'; // fecha y hora en que empezaron (hora Colombia)

// Todo sale de una carpeta de Google Drive:
// - Álbum: una subcarpeta por cita (se ordenan por nombre: "01 Nos hicimos novios", "02 Primer mes"...).
//   El texto de cada foto es su "Descripción" en Drive.
// - Cartas: subcarpeta "Cartas". Cada foto es una carta; si tiene varias páginas, una subcarpeta con una foto por página.
//   El nombre de la foto o subcarpeta es el título ("01 Mi primera carta").
const DRIVE_CARPETA = '1bfBzTVraj5zJXESwc57ofePtUybQEaMh'; // ID de la carpeta principal (lo que va después de /folders/ en el link)
const DRIVE_CLAVE = 'AIzaSyCzEVuzj9P6EhPD7hwDVhsYKPEGUc-XFfQ';   // clave de API de Google
// ✏️ ====================== ✏️

// Inicio: sobre + arco → ventana con la pregunta → solo se entra con "YES"
const inicio = document.getElementById('inicio');
const si = document.getElementById('si'), no = document.getElementById('no');
const arco = document.getElementById('arco'), barraCarga = document.querySelector('.carga i');

// fondo: corazones y nubes subiendo
for (let i = 0; i < 16; i++) {
  const s = document.createElement('span');
  s.className = 'flota';
  s.textContent = ['♥', '☁', '✦', '♡'][i % 4];
  s.style.left = Math.random() * 100 + '%';
  s.style.color = i % 2 ? '#f7a8c4' : '#9cd2f2';
  s.style.animationDuration = 8 + Math.random() * 8 + 's';
  s.style.animationDelay = -Math.random() * 16 + 's';
  inicio.prepend(s);
}

// arco: mantener presionado tensa la cuerda; solo dispara si se suelta con la carga al máximo
const cuerda = arco.querySelector('.cuerda'), flechita = arco.querySelector('.flechita');
const TENSION = 45; // cuánto baja la cuerda con carga completa
let inicioCarga = 0, carga = 0;
function tensar(k) {
  cuerda.setAttribute('points', `15,80 70,${80 + TENSION * k} 125,80`);
  flechita.style.transform = `translateY(${TENSION * k}px)`;
  barraCarga.style.width = k * 100 + '%';
  arco.classList.toggle('lista', k === 1);
}
function cargar() {
  if (!inicioCarga) return;
  carga = Math.min(1, (performance.now() - inicioCarga) / 1200);
  tensar(carga);
  requestAnimationFrame(cargar);
}
arco.onpointerdown = e => {
  arco.setPointerCapture(e.pointerId);
  inicioCarga = performance.now();
  cargar();
};
arco.onpointerup = arco.onpointercancel = () => {
  if (!inicioCarga) return;
  inicioCarga = 0;
  if (carga < 1) {
    tensar(0); // la cuerda vuelve sin disparar
    const pista = document.querySelector('.pista');
    pista.classList.remove('tiembla');
    pista.offsetWidth; // reinicia la animación
    pista.classList.add('tiembla');
    return;
  }
  disparar();
};
arco.oncontextmenu = e => e.preventDefault(); // el toque largo en celular no abre menú

function disparar() {
  arco.style.pointerEvents = 'none';
  arco.classList.remove('lista');
  cuerda.setAttribute('points', '15,80 70,80 125,80'); // la cuerda se suelta
  const punta = flechita.getBoundingClientRect(), sobre = document.querySelector('.sobre');
  const hasta = sobre.getBoundingClientRect();
  const dx = hasta.left + hasta.width / 2 - (punta.left + punta.width / 2);
  const dy = hasta.top + hasta.height / 2 - punta.top + TENSION;
  flechita.animate([{transform: `translateY(${TENSION}px)`}, {transform: `translate(${dx}px, ${dy}px)`}],
    {duration: 380, easing: 'ease-in', fill: 'forwards'}).onfinish = () => {
    flechita.remove();
    sobre.classList.add('abierto');
    setTimeout(() => {
      document.getElementById('paso1').remove();
      document.getElementById('ventana').hidden = false;
    }, 800);
  };
}

si.onclick = () => {
  document.getElementById('pregunta').textContent = 'Yayyy! I knew it ♡';
  document.querySelector('#inicio .opciones').remove();
  const c = document.querySelector('.cinna').getBoundingClientRect();
  for (let i = 0; i < 40; i++) { // explosión de corazones desde Cinnamoroll
    const h = document.createElement('span');
    h.className = 'corazon';
    h.textContent = ['♥', '💙', '🤍', '💗'][i % 4];
    h.style.left = c.left + c.width / 2 + 'px';
    h.style.top = c.top + c.height / 2 + 'px';
    const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 260;
    h.style.setProperty('--x', Math.cos(ang) * dist + 'px');
    h.style.setProperty('--y', Math.sin(ang) * dist + 'px');
    h.style.animationDelay = Math.random() * .3 + 's';
    inicio.append(h);
  }
  setTimeout(() => inicio.classList.add('saliendo'), 2000);
  setTimeout(() => inicio.remove(), 2600);
};
no.onclick = () => {
  if (no.style.position !== 'fixed') { // primera vez: arranca desde donde está para que se vea el salto
    const b = no.getBoundingClientRect();
    Object.assign(no.style, {position: 'fixed', left: b.left + 'px', top: b.top + 'px', margin: 0});
    no.offsetWidth; // aplica la posición inicial antes de animar
  }
  const a = si.getBoundingClientRect();
  let x, y;
  do { // que no caiga encima de "Yes"
    x = Math.random() * (innerWidth - no.offsetWidth);
    y = Math.random() * (innerHeight - no.offsetHeight);
  } while (x < a.right && x + no.offsetWidth > a.left && y < a.bottom && y + no.offsetHeight > a.top);
  no.style.left = x + 'px';
  no.style.top = y + 'px';
};

// Paneles
const tabs = document.querySelectorAll('nav button');
tabs.forEach(b => b.onclick = () => {
  tabs.forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== b.dataset.panel);
});

// Cartas
const dlgCarta = document.getElementById('carta');
const listaCartas = document.querySelector('.cartas');
const sinNumero = nombre => nombre.replace(/^\d+\s*[-.·]?\s*/, ''); // "01 Título" → "Título"

async function cargarCartas(carpeta) {
  const items = await driveListar(carpeta, "(mimeType contains 'image/' or mimeType = 'application/vnd.google-apps.folder')");
  const paginas = await Promise.all(items.map(c =>
    c.mimeType.startsWith('image/') ? [c] : driveListar(c.id, "mimeType contains 'image/'")));
  listaCartas.textContent = '';
  items.forEach((c, i) => {
    const pags = paginas[i];
    if (!pags.length) return;
    const titulo = sinNumero(c.name.replace(/\.\w+$/, ''));
    const b = document.createElement('button');
    b.className = 'carta';
    b.innerHTML = '<span class="mini"><img alt="" loading="lazy"></span><span><strong></strong><small></small></span>';
    enderezar(b.querySelector('img'), pags[0]);
    b.querySelector('img').src = foto(pags[0].id, 200);
    b.querySelector('strong').textContent = titulo;
    b.querySelector('small').textContent =
      new Date(c.createdTime).toLocaleDateString('es-CO', {day: 'numeric', month: 'long', year: 'numeric'});
    b.onclick = () => abrirCarta(titulo, pags);
    listaCartas.append(b);
  });
  if (!listaCartas.children.length) listaCartas.textContent = 'Todavía no hay cartas 💌';
}

function abrirCarta(titulo, pags) {
  dlgCarta.querySelector('h2').textContent = titulo;
  const cont = dlgCarta.querySelector('.paginas');
  cont.textContent = '';
  const ancho = Math.min(800, innerWidth * .92) - 48; // ancho del diálogo menos su padding
  for (const f of pags) {
    const marco = document.createElement('div');
    marco.className = 'marco';
    const img = document.createElement('img');
    encajar(marco, img, f, ancho, Infinity);
    img.src = foto(f.id, 1600);
    marco.append(img);
    cont.append(marco);
  }
  dlgCarta.showModal();
  dlgCarta.scrollTop = 0;
}

// Contador
const p = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
function contar() {
  const s = new Date(INICIO), n = new Date();
  let meses = (n.getFullYear() - s.getFullYear()) * 12 + n.getMonth() - s.getMonth();
  if (n.getDate() < s.getDate()) meses--;
  // mismo día del mes de inicio, ajustado si ese mes es más corto (ej. 31 → 30)
  const finMes = new Date(s.getFullYear(), s.getMonth() + meses + 1, 0).getDate();
  const ancla = new Date(s.getFullYear(), s.getMonth() + meses, Math.min(s.getDate(), finMes));
  const hoy = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const d = Math.round((hoy - ancla) / 864e5);
  const total = Math.round((hoy - new Date(s.getFullYear(), s.getMonth(), s.getDate())) / 864e5);

  document.getElementById('dias').textContent = p(total, 'día', 'días');
  document.getElementById('detalle').textContent =
    `${p(Math.floor(meses / 12), 'año', 'años')}, ${p(meses % 12, 'mes', 'meses')} y ${p(d, 'día', 'días')}`;
  document.getElementById('segundos').textContent =
    `o ${Math.floor((n - s) / 1000).toLocaleString('es')} segundos 💙`;
  document.getElementById('sub').textContent = `☁ ${p(total, 'día', 'días')} juntos ☁`;
}
contar();
setInterval(contar, 1000);

// Encabezado: nubes que pasan, brillitos y Cinnamoroll (el dibujo hasta que llegue la imagen de Drive)
const cielo = document.querySelector('.cielo');
for (let i = 0; i < 5; i++) {
  const n = document.createElement('span');
  n.className = 'nube';
  n.textContent = '☁';
  n.style.top = 5 + Math.random() * 70 + '%';
  n.style.fontSize = 22 + Math.random() * 30 + 'px';
  n.style.animationDuration = 14 + Math.random() * 14 + 's';
  n.style.animationDelay = -Math.random() * 28 + 's';
  cielo.prepend(n);
}
for (let i = 0; i < 6; i++) {
  const b = document.createElement('span');
  b.className = 'brillo';
  b.textContent = '✦';
  b.style.left = 5 + Math.random() * 90 + '%';
  b.style.top = 5 + Math.random() * 80 + '%';
  b.style.fontSize = 8 + Math.random() * 8 + 'px';
  b.style.animationDelay = -Math.random() * 2 + 's';
  cielo.prepend(b);
}
document.getElementById('cabeza-cinna').append(document.querySelector('svg.cinna').cloneNode(true));

// Álbum: galería a pantalla completa que se desliza
const dlgFoto = document.getElementById('foto');
const tira = dlgFoto.querySelector('.tira');
const cuenta = dlgFoto.querySelector('.cuenta');
const pasar = dir => tira.scrollBy({left: dir * tira.clientWidth, behavior: 'smooth'});
dlgFoto.querySelector('.cerrar').onclick = () => dlgFoto.close();
dlgFoto.querySelector('.ant').onclick = () => pasar(-1);
dlgFoto.querySelector('.sig').onclick = () => pasar(1);
dlgFoto.onkeydown = e => { if (e.key === 'ArrowLeft') pasar(-1); if (e.key === 'ArrowRight') pasar(1); };
tira.onclick = e => { if (e.target.classList.contains('slide')) dlgFoto.close(); }; // tocar fuera de la foto cierra
dlgFoto.onclose = () => tira.textContent = ''; // también detiene videos

// La diapositiva visible: mejora la foto a nítida, actualiza "3 / 39" y detiene videos que quedaron atrás
const visible = new IntersectionObserver(entradas => {
  for (const {target: s, isIntersecting} of entradas) {
    if (!isIntersecting) { if (s.querySelector('iframe')) portadaVideo(s.marco, s.f); continue; }
    cuenta.textContent = `${[...tira.children].indexOf(s) + 1} / ${tira.children.length}`;
    const img = s.querySelector('img:not(.portada)');
    if (img && !s.nitida) {
      s.nitida = true;
      const n = new Image();
      n.onload = () => img.src = n.src;
      n.src = foto(s.f.id, 1600);
    }
  }
}, {root: tira, threshold: .6});

function portadaVideo(marco, f) {
  marco.innerHTML = '<img class="portada" alt=""><button class="play" aria-label="Reproducir">▶</button>';
  marco.querySelector('img').src = foto(f.id, 400);
  marco.querySelector('button').onclick = () =>
    marco.innerHTML = `<iframe src="https://drive.google.com/file/d/${f.id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
}

function diapositiva(f) {
  const s = document.createElement('div');
  s.className = 'slide';
  s.f = f;
  const marco = s.marco = document.createElement('div');
  marco.className = 'marco';
  if (f.mimeType.startsWith('video/')) {
    const {width: w = 16, height: h = 9} = f.videoMediaMetadata || {};
    const k = Math.min(innerWidth * .92 / w, innerHeight * .8 / h);
    marco.style.width = w * k + 'px';
    marco.style.height = h * k + 'px';
    portadaVideo(marco, f);
  } else {
    const img = document.createElement('img');
    img.alt = f.description || '';
    encajar(marco, img, f, innerWidth * .92, innerHeight * .8);
    img.src = foto(f.id, 400); // la miniatura ya está en caché: se ve al instante y luego se cambia por la nítida
    marco.append(img);
  }
  const texto = document.createElement('p');
  texto.textContent = f.description || '';
  s.append(marco, texto);
  visible.observe(s);
  return s;
}

function abrirGaleria(lista, i) {
  tira.textContent = '';
  tira.append(...lista.map(diapositiva));
  dlgFoto.showModal();
  tira.scrollLeft = i * tira.clientWidth;
}

const citas = document.getElementById('citas');
const foto = (id, ancho) => `https://drive.google.com/thumbnail?id=${id}&sz=w${ancho}`;
const fecha = f => f.name.replace(/^\D+/, ''); // IMG_20260904_... / VID_20260904_... → orden cronológico

// rotation = cuartos de vuelta que le faltan a la foto original. Drive a veces entrega la imagen
// ya girada (tamaños grandes) y a veces no (miniaturas), así que se decide al cargarla.
const giro = f => (f.imageMediaMetadata?.rotation || 0) * 90;
function giroReal(img, f) {
  const g = giro(f), {width: w = 1, height: h = 1} = f.imageMediaMetadata || {};
  if (g % 180 === 0) return g;
  return (img.naturalWidth > img.naturalHeight) === (w > h) ? g : 0; // misma forma que el original → falta girar
}
function enderezar(img, f) { // para miniaturas cuadradas
  img.onload = () => img.style.transform = `rotate(${giroReal(img, f)}deg)`;
}

// Escala la foto para que quepa en maxW×maxH; el marco toma el tamaño ya enderezado
function encajar(marco, img, f, maxW, maxH) {
  const {width: w = 1, height: h = 1} = f.imageMediaMetadata || {};
  const [vw, vh] = giro(f) % 180 ? [h, w] : [w, h];
  const s = Math.min(maxW / vw, maxH / vh);
  marco.style.width = vw * s + 'px';
  marco.style.height = vh * s + 'px';
  const poner = r => {
    img.style.width = (r % 180 ? vh : vw) * s + 'px';
    img.style.height = (r % 180 ? vw : vh) * s + 'px';
    img.style.transform = `translate(-50%, -50%) rotate(${r}deg)`;
  };
  poner(0);
  img.onload = () => poner(giroReal(img, f));
}

async function driveListar(carpeta, filtro) {
  const q = encodeURIComponent(`'${carpeta}' in parents and trashed = false and ${filtro}`);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=name&pageSize=1000` +
    `&fields=files(id,name,description,mimeType,createdTime,imageMediaMetadata(width,height,rotation),videoMediaMetadata(width,height))` +
    `&key=${DRIVE_CLAVE}`);
  if (!r.ok) throw new Error(`Drive respondió ${r.status}`);
  return (await r.json()).files;
}

// Si en la carpeta principal hay una imagen llamada "cinnamoroll…", reemplaza al dibujo (inicio y encabezado)
async function cargarCinnamoroll() {
  const [f] = await driveListar(DRIVE_CARPETA, "mimeType contains 'image/' and name contains 'cinnamoroll'");
  if (!f) return;
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&key=${DRIVE_CLAVE}`);
  const c = quitarFondo(await createImageBitmap(await r.blob()));
  c.className = 'cinna';
  c.setAttribute('aria-label', 'Cinnamoroll');
  const copia = document.createElement('canvas');
  copia.width = c.width;
  copia.height = c.height;
  copia.getContext('2d').drawImage(c, 0, 0);
  document.getElementById('cabeza-cinna').replaceChildren(copia);
  document.querySelector('#ventana svg.cinna')?.replaceWith(c);
}

// "Varita mágica": vuelve transparente el fondo claro y gris (blanco o cuadritos falsos) que toca
// los bordes de la imagen. Lo de adentro del contorno (el cuerpo blanco) no se toca.
function quitarFondo(bmp) {
  const c = document.createElement('canvas');
  const W = c.width = bmp.width, H = c.height = bmp.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(bmp, 0, 0);
  const datos = ctx.getImageData(0, 0, W, H), px = datos.data;
  const esFondo = i => {
    const mn = Math.min(px[i], px[i + 1], px[i + 2]), mx = Math.max(px[i], px[i + 1], px[i + 2]);
    return mn > 170 && mx - mn < 22; // claro y sin color
  };
  const visto = new Uint8Array(W * H), pila = [];
  for (let x = 0; x < W; x++) pila.push(x, x + (H - 1) * W);
  for (let y = 0; y < H; y++) pila.push(y * W, y * W + W - 1);
  while (pila.length) {
    const p = pila.pop();
    if (visto[p]) continue;
    visto[p] = 1;
    if (!esFondo(p * 4)) continue;
    px[p * 4 + 3] = 0;
    const x = p % W;
    if (x > 0) pila.push(p - 1);
    if (x < W - 1) pila.push(p + 1);
    if (p >= W) pila.push(p - W);
    if (p < W * H - W) pila.push(p + W);
  }
  ctx.putImageData(datos, 0, 0);
  // recorta al dibujo para que quede centrado aunque la imagen tenga más espacio a un lado
  let x0 = W, y0 = H, x1 = 0, y1 = 0;
  for (let p = 0; p < W * H; p++) if (px[p * 4 + 3]) {
    const x = p % W, y = (p - x) / W;
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  if (x1 < x0) return c;
  const recorte = document.createElement('canvas');
  recorte.width = x1 - x0 + 1;
  recorte.height = y1 - y0 + 1;
  recorte.getContext('2d').drawImage(c, -x0, -y0);
  return recorte;
}

async function cargarDrive() {
  cargarCinnamoroll().catch(() => {}); // si falla, se queda el dibujo
  citas.textContent = listaCartas.textContent = 'Cargando…';
  try {
    const todas = await driveListar(DRIVE_CARPETA, "mimeType = 'application/vnd.google-apps.folder'");
    const cartas = todas.find(c => c.name.trim().toLowerCase() === 'cartas');
    if (cartas) cargarCartas(cartas.id).catch(e => listaCartas.textContent = 'No pude cargar las cartas 😢 (' + e.message + ')');
    else listaCartas.textContent = 'Todavía no hay cartas 💌';
    const carpetas = todas.filter(c => c !== cartas);
    const archivos = await Promise.all(carpetas.map(c =>
      driveListar(c.id, "(mimeType contains 'image/' or mimeType contains 'video/')")));
    citas.textContent = '';
    carpetas.forEach((c, i) => {
      // cada cita se despliega al tocarla; las fotos de una cita cerrada no se descargan
      const sec = document.createElement('details');
      const h = document.createElement('summary');
      h.innerHTML = '<span></span><small></small>';
      h.querySelector('span').textContent = sinNumero(c.name);
      h.querySelector('small').textContent = archivos[i].length;
      const grid = document.createElement('div');
      grid.className = 'album';
      const lista = archivos[i].sort((a, b) => fecha(a).localeCompare(fecha(b)));
      lista.forEach((f, j) => {
        const b = document.createElement('button');
        if (f.mimeType.startsWith('video/')) b.className = 'video';
        const img = document.createElement('img');
        enderezar(img, f);
        img.loading = 'lazy'; // antes del src, para que no descargue hasta que se despliegue la cita
        img.src = foto(f.id, 400);
        img.alt = f.description || '';
        b.append(img);
        b.onclick = () => abrirGaleria(lista, j);
        grid.append(b);
      });
      sec.append(h, grid);
      citas.append(sec);
    });
  } catch (e) {
    citas.textContent = listaCartas.textContent = 'No pude conectar con Drive 😢 (' + e.message + ')';
  }
}
cargarDrive();
