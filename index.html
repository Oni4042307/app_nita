<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti ❤</title>
<style>
:root{--rosa:#e75480;--fondo:#fff5f8;--texto:#4a2c36}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--fondo);color:var(--texto)}
nav{position:sticky;top:0;display:flex;background:#fff;box-shadow:0 2px 8px #0001}
nav button{flex:1;padding:14px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;color:inherit;cursor:pointer}
nav button[aria-selected=true]{border-color:var(--rosa);color:var(--rosa);font-weight:600}
main{max-width:720px;margin:auto;padding:16px}
h1{text-align:center;color:var(--rosa);font-weight:500}
.cartas{display:grid;gap:12px}
.carta{padding:18px;border:0;border-radius:12px;background:#fff;box-shadow:0 2px 8px #0001;text-align:left;font:inherit;color:inherit;cursor:pointer}
.carta small{display:block;opacity:.6;margin-top:4px}
.grande{font-size:4.5rem;text-align:center;color:var(--rosa);margin:24px 0 0}
.centro{text-align:center}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
dialog{border:0;border-radius:12px;max-width:min(600px,92vw);padding:24px;color:inherit}
dialog::backdrop{background:#0008}
#carta p{white-space:pre-line;line-height:1.7}
#carta button{background:var(--rosa);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}
#foto{padding:0;background:none}
#foto img{max-width:92vw;max-height:80vh;display:block;border-radius:12px}
#foto p{color:#fff;text-align:center}
</style>
</head>
<body>
<nav>
  <button data-panel="cartas" aria-selected="true">💌 Cartas</button>
  <button data-panel="contador" aria-selected="false">⏳ Contador</button>
  <button data-panel="album" aria-selected="false">📷 Álbum</button>
</nav>
<main>
  <section id="cartas"><h1>Cartas para ti</h1><div class="cartas"></div></section>
  <section id="contador" hidden>
    <h1>Llevamos juntos</h1>
    <p class="grande" id="dias"></p>
    <p class="centro" id="detalle"></p>
    <p class="centro" id="segundos"></p>
  </section>
  <section id="album" hidden><h1>Nuestro álbum</h1><div class="album"></div></section>
</main>

<dialog id="carta"><h2></h2><p></p><form method="dialog"><button>Cerrar</button></form></dialog>
<dialog id="foto"><img alt=""><p></p></dialog>

<script>
// ✏️ ===== EDITA AQUÍ ===== ✏️
const INICIO = '2026-08-04T00:00'; // fecha y hora en que empezaron

const CARTAS = [
  {titulo: 'Mi primera carta', fecha: '30 oct 2026', texto: `Escribe aquí tu carta.
Puedes usar varias líneas.`},
];

// Pon las fotos dentro de la carpeta "fotos" y escribe sus nombres aquí
const FOTOS = [
  // {archivo: 'foto1.jpg', texto: 'Nuestra primera cita'},
];
// ✏️ ====================== ✏️

// Paneles
const tabs = document.querySelectorAll('nav button');
tabs.forEach(b => b.onclick = () => {
  tabs.forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== b.dataset.panel);
});

// Cartas
const dlgCarta = document.getElementById('carta');
for (const c of CARTAS) {
  const b = document.createElement('button');
  b.className = 'carta';
  b.innerHTML = '<strong></strong><small></small>';
  b.querySelector('strong').textContent = c.titulo;
  b.querySelector('small').textContent = c.fecha;
  b.onclick = () => {
    dlgCarta.querySelector('h2').textContent = c.titulo;
    dlgCarta.querySelector('p').textContent = c.texto;
    dlgCarta.showModal();
  };
  document.querySelector('.cartas').append(b);
}

// Contador
const p = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
function contar() {
  const s = new Date(INICIO), n = new Date();
  let meses = (n.getFullYear() - s.getFullYear()) * 12 + n.getMonth() - s.getMonth();
  if (n.getDate() < s.getDate()) meses--;
  // mismo día del mes de inicio, ajustado si ese mes es más corto (ej. 31 → 30)
  const finMes = new Date(s.getFullYear(), s.getMonth() + meses + 1, 0).getDate();
  const ancla = new Date(s.getFullYear(), s.getMonth() + meses, Math.min(s.getDate(), finMes));
  const hoy = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const d = Math.round((hoy - ancla) / 864e5);
  const total = Math.round((hoy - new Date(s.getFullYear(), s.getMonth(), s.getDate())) / 864e5);

  document.getElementById('dias').textContent = p(total, 'día', 'días');
  document.getElementById('detalle').textContent =
    `${p(Math.floor(meses / 12), 'año', 'años')}, ${p(meses % 12, 'mes', 'meses')} y ${p(d, 'día', 'días')}`;
  document.getElementById('segundos').textContent =
    `o ${Math.floor((n - s) / 1000).toLocaleString('es')} segundos ❤`;
}
contar();
setInterval(contar, 1000);

// Álbum
const dlgFoto = document.getElementById('foto');
dlgFoto.onclick = () => dlgFoto.close();
for (const f of FOTOS) {
  const img = document.createElement('img');
  img.src = 'fotos/' + f.archivo;
  img.alt = f.texto || '';
  img.loading = 'lazy';
  img.onclick = () => {
    dlgFoto.querySelector('img').src = img.src;
    dlgFoto.querySelector('p').textContent = f.texto || '';
    dlgFoto.showModal();
  };
  document.querySelector('.album').append(img);
}
</script>
</body>
</html>
